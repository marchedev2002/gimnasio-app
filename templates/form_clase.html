<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Clase · {{ nombre_gimnasio }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    {% include 'partials/navbar.html' %}
    <div class="db-wrapper db-wrapper--narrow">
        <p class="db-eyebrow">Administración</p>
        <h1 class="db-page-title">Nueva clase</h1>

        <div class="db-card">
            {% if error %}
                <p class="db-alert-error">{{ error }}</p>
            {% endif %}

            {% if not profesores %}
                <p class="db-empty">Primero tenés que cargar al menos un profesor.</p>
            {% else %}
                <form action="{{ url_for('nueva_clase') }}" method="POST">
                    <div class="db-field">
                        <label>Nombre de la clase</label>
                        <input type="text" name="nombre" class="db-input" placeholder="Ej: Spinning, Funcional..." required autofocus>
                    </div>

                    <div class="db-field">
                        <label>Hora de inicio</label>
                        <input type="time" name="hora_inicio" class="db-input" required>
                    </div>

                    <div class="db-field">
                        <label>Hora de fin</label>
                        <input type="time" name="hora_fin" class="db-input" required>
                    </div>

                    <div class="db-field">
                        <label>Profesor a cargo</label>
                        <select name="id_profesor" class="db-input" required>
                            <option value="">-- Seleccioná --</option>
                            {% for profesor in profesores %}
                                <option value="{{ profesor.id_profesor }}">{{ profesor.nombre }} {{ profesor.apellido }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="db-btn-row">
                        <button type="submit" class="db-btn db-btn-primary">Guardar</button>
                        <a href="{{ url_for('admin_general') }}" class="db-btn db-btn-secondary">Cancelar</a>
                    </div>
                </form>
            {% endif %}
        </div>
    </div>
</body>
</html>
