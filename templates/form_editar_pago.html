<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar pago · {{ nombre_gimnasio }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>*{box-sizing:border-box}body{margin:0;background:#08080a}input,select,button{font-family:inherit}</style>
</head>
<body>
    {% include 'partials/navbar_simple.html' %}

    <div style="min-height:calc(100vh - 60px);display:grid;place-items:center;padding:28px;background:radial-gradient(120% 90% at 50% -20%, #17090c 0%, #08080a 62%);font-family:Inter, system-ui, sans-serif;color:#f4f4f5;-webkit-font-smoothing:antialiased">
    <div role="dialog" aria-labelledby="ep-title" style="width:min(480px,100%);background:#101013;border:1px solid rgba(255,255,255,0.09);border-radius:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,0.9), 0 0 0 1px rgba(226,50,59,0.07);overflow:hidden">

        <header style="display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,0.07);background:linear-gradient(180deg, rgba(226,50,59,0.07), rgba(226,50,59,0))">
            <span style="width:3px;height:34px;border-radius:2px;background:#e2323b;flex:none;margin-top:2px"></span>
            <div style="min-width:0">
                <h1 id="ep-title" style="margin:0;font-size:18px;font-weight:600;letter-spacing:-0.01em;line-height:1.25">Editar pago</h1>
                <p style="margin:3px 0 0;font-size:12.5px;color:#8a8a93">{{ pago.nombre }} {{ pago.apellido }} · {{ pago.fecha_pago.strftime('%d/%m/%Y') }}</p>
            </div>
            <a href="{{ url_for('index') }}" aria-label="Cerrar" style="margin-left:auto;width:36px;height:36px;flex:none;display:grid;place-items:center;background:transparent;border:1px solid rgba(255,255,255,0.1);border-radius:9px;color:#b6b6bf;text-decoration:none">
                <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"></path></svg>
            </a>
        </header>

        <form action="{{ url_for('editar_pago', id_pago=pago.id_pago) }}" method="POST">
            <div style="padding:20px;display:flex;flex-direction:column;gap:16px">

                {% if error %}
                    <p class="db-alert-error">{{ error }}</p>
                {% endif %}

                <div class="db-field" style="margin-bottom:0">
                    <label>Plan</label>
                    <select name="id_precio" class="db-input" required>
                        {% for precio in precios %}
                            <option value="{{ precio.id_precio }}" {% if precio.id_precio == pago.id_precio %}selected{% endif %}>
                                {{ precio.tipo_membresia }} — ${{ "%.0f"|format(precio.monto) }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="db-field" style="margin-bottom:0">
                    <label>Método de pago</label>
                    <select name="metodo_pago" class="db-input" required>
                        <option value="Efectivo" {% if pago.metodo_pago == 'Efectivo' %}selected{% endif %}>💵 Efectivo</option>
                        <option value="Debito" {% if pago.metodo_pago == 'Debito' %}selected{% endif %}>💳 Débito</option>
                    </select>
                </div>

                <p style="font-size:11.5px;color:#6e6e78;margin:0">
                    El mes cubierto ({{ pago.anio }}, mes {{ pago.id_mes }}) y la fecha de pago no se modifican desde acá.
                </p>
            </div>

            <footer style="display:flex;align-items:center;gap:10px;padding:14px 18px;border-top:1px solid rgba(255,255,255,0.07);background:#0c0c0f">
                <a href="{{ url_for('index') }}" style="min-height:40px;padding:0 14px;display:inline-flex;align-items:center;background:transparent;border:1px solid rgba(255,255,255,0.14);border-radius:10px;font-size:13.5px;font-weight:500;color:#f4f4f5;text-decoration:none">Cancelar</a>
                <button type="submit" style="margin-left:auto;min-height:40px;padding:0 18px;display:inline-flex;align-items:center;gap:7px;background:#e2323b;border:1px solid #e2323b;border-radius:10px;font-size:13.5px;font-weight:600;color:#fff;cursor:pointer;box-shadow:0 6px 18px -8px rgba(226,50,59,0.9)">
                    Guardar cambios
                </button>
            </footer>
        </form>
    </div>
    </div>
</body>
</html>
